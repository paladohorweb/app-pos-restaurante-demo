spring:
  application:
    name: nativa-pos-api
  profiles:
    default: demo
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8080}
  error:
    include-message: always
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}
---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:nativa;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nativa_pos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:nativa}
    password: ${DB_PASS:nativa_secret}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
